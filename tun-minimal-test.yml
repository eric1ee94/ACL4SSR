# TUN 定位测试版（2026-08-28）
# 目的：验证 TUN 全断是否由"geo 数据依赖"引起
# 与完整配置的差异：无 geox-url（不下载 GEOIP/GEOSITE）、无 rule-providers（不下载规则集）、无 GEOSITE/GEOIP 规则、
# 无 sniffer、无 geosite 引用；保留节点+订阅+最简 DNS
# 若此版本 TUN 能上网 → 元凶 = geo 数据下载/引用；若仍全断 → 元凶在更基础处

port: 7890
socks-port: 7891
mixed-port: 7892

allow-lan: true
mode: rule
log-level: info
ipv6: false
udp: true

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - 223.5.5.5

